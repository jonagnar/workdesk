# Manifest of every project this workdesk indexes.
# This file is descriptive only — nothing reads it as a runtime dependency.
# Each project remains fully standalone and clonable without this repo.
#
# - name: example-project
#   canonical: git@forgejo.example.com:jon/example-project.git
#   mirror: git@github.com:jonnxor/example-project.git
#   path: ~/projects/example-project
#   kind: app        # app | servers | other

# canonical/mirror are null until the Forgejo instance exists and GitHub is
# authenticated; fill them in then.
projects:
  - name: workdesk
    canonical: ~
    mirror: ~
    path: ~/projects/workdesk
    kind: other
  - name: vault
    canonical: ~
    mirror: ~
    path: ~/projects/vault
    kind: other
  - name: servers
    canonical: ~
    mirror: ~
    path: ~/projects/servers
    kind: servers
