# Every project on the desk.
#
# This is read by:
#   mise run desk:status  — what's on the desk, what state it's in, and any
#                           drift (listed but missing, or present but unlisted)
#   mise run desk:clone   — materialise the whole desk on a fresh machine
#
# A project lives at ~/Projects/<name> and is a standalone git repo. This file
# records where each one CAME FROM — never anything it depends on.
#
# canonical: the Forgejo remote (source of truth)
# mirror:    the GitHub push-mirror (convenience copy, never load-bearing)
# kind:      app | library | servers | notes
#
# Both remotes are null until the Forgejo instance is up.

projects:
  - name: vault
    canonical: ~
    mirror: ~
    kind: notes
  - name: servers
    canonical: ~
    mirror: ~
    kind: servers
