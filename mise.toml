[env]
# Not a secret, so it can live here in the clear. The B2 credentials
# deliberately do NOT live in [env] — see backup/run.sh.
RESTIC_LOCAL = "{{env.HOME}}/Backups/restic"

[tasks.new]
description = "Scaffold a standalone project: mise run new -- repos/<name>"
# Deliberately the git URL, not a local path: copier records it in the new
# project's .copier-answers.yml, and an absolute path there is meaningless on
# anyone else's machine — `copier update` would only ever work here.
run = "copier copy --trust ssh://git@git.jonnxor.is:2222/WAAAGH/workdesk.git"

[tasks.backup]
description = "Back up to the local repo and to B2, keeping the last 3 snapshots in each"
run = "sops exec-env backup/restic.env.enc.yaml 'backup/run.sh backup'"

[tasks."backup:init"]
description = "Create either repository if it doesn't exist yet (safe to re-run)"
run = "sops exec-env backup/restic.env.enc.yaml 'backup/run.sh init'"

[tasks."backup:snapshots"]
description = "List snapshots in both repositories"
run = "sops exec-env backup/restic.env.enc.yaml 'backup/run.sh snapshots'"

[tasks."backup:check"]
description = "Verify integrity of both repositories"
run = "sops exec-env backup/restic.env.enc.yaml 'backup/run.sh check'"

[tasks."backup:restore-test"]
description = "Restore the age key from the latest B2 snapshot into a scratch dir"
run = "sops exec-env backup/restic.env.enc.yaml 'backup/run.sh restore-test'"

[tasks."backup:install"]
description = "Install and enable the nightly systemd user timer"
run = """
mkdir -p ~/.config/systemd/user
cp backup/restic-backup.service backup/restic-backup.timer ~/.config/systemd/user/
systemctl --user daemon-reload
systemctl --user enable --now restic-backup.timer
systemctl --user list-timers restic-backup.timer
"""
